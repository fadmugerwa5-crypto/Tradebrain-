name: Build Windows app
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: build-windows, cancel-in-progress: true }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Build the app
        shell: bash
        run: |
          npm run build
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Make the portable .exe
        working-directory: desktop
        run: npx electron-builder --win portable --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: TradeBrain-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish to the "latest" release
        continue-on-error: true
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "TradeBrain - latest build" --notes "Rolling build from the main branch. Android: the .apk (standalone, no server). Windows: the portable .exe." --target "${{ github.sha }}" || true
          gh release upload latest desktop/dist/*.exe --clobber
