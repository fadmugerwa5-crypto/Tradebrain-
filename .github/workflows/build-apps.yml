name: Build ClassPulse apps (Android + Windows)

on:
  workflow_dispatch:
  push:
    branches: [ classpulse, main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check source and run the tests
        run: |
          node --check server/server.cjs
          find app/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check desktop/main.js
          node --check desktop/static-server.js
          node server/server.cjs --port 8791 --quiet --db "$RUNNER_TEMP/classpulse-test.db" &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8791/api/health >/dev/null; then break; fi
            sleep 1
          done
          node tools/e2e.cjs http://127.0.0.1:8791
          node tools/scan-test.cjs
          node tools/logic-test.cjs
          node tools/academic-test.cjs

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install Capacitor 7
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ClassPulse-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          node prepare.cjs
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ClassPulse-Windows
          path: |
            desktop/dist/ClassPulse-Setup-*.exe
            desktop/dist/ClassPulse-Portable-*.exe
