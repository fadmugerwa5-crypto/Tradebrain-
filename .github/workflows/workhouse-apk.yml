name: Workhouse APK
on:
  workflow_dispatch:
  push:
    branches: [command-center]
    paths: ['ai-command-center/**', '.github/workflows/workhouse-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run the tests
        run: npm test
      - name: Build the app files
        run: node mobile/build-www.js
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build the Android app (Capacitor)
        working-directory: ai-command-center/mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Workhouse.apk
      - name: Publish Workhouse.apk as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: workhouse-latest
          name: Workhouse (latest build)
          target_commitish: ${{ github.sha }}
          files: ai-command-center/Workhouse.apk
