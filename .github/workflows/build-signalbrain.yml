name: Build SignalBrain APK
on:
  push: { branches: [signalbrain] }
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: build-signalbrain, cancel-in-progress: true }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: npx cap add android
      - name: Add the background service
        run: |
          JD=android/app/src/main/java/com/signalbrain/app
          test -d "$JD" || { echo "::error::Android source folder $JD not found"; exit 1; }
          cp native/*.java "$JD/"
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          svc = '        <service android:name=".SignalService" android:exported="false" android:foregroundServiceType="dataSync" />\n'
          perms = "".join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in ["FOREGROUND_SERVICE", "FOREGROUND_SERVICE_DATA_SYNC", "POST_NOTIFICATIONS", "WAKE_LOCK", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"])
          assert "</application>" in s and "</manifest>" in s
          s = s.replace("</application>", svc + "    </application>", 1)
          s = s.replace("</manifest>", perms + "</manifest>", 1)
          open(p, "w").write(s)
          PY
          grep -q SignalService android/app/src/main/AndroidManifest.xml || { echo "::error::manifest patch failed"; exit 1; }
      - name: Icons and app files
        run: |
          cp -r icons/. android/app/src/main/res/
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html || { echo "::error::app files not copied"; exit 1; }
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" SignalBrain.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SignalBrain-Android
          path: SignalBrain.apk
          if-no-files-found: error
      - name: Publish to the latest release
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view signalbrain-latest >/dev/null 2>&1 || gh release create signalbrain-latest --title "SignalBrain - latest build" --notes "Rolling Android build." --target "${{ github.sha }}" || true
          gh release upload signalbrain-latest SignalBrain.apk --clobber
