name: Workhouse Pro App Build

on:
  push:
    branches: [command-center]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Workhouse Pro
        run: |
          chmod +x ai-command-center/workhouse-pro.sh
          cd ai-command-center
          sh workhouse-pro.sh
