<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#e6f4ee;background:linear-gradient(140deg,#042a1f,#0b4030 55%,#4a3a14) fixed;min-height:100vh;padding:14px 12px 90px}

<script>(()=>{
const rd=(f,d)=>{try{return JSON.parse(localStorage.getItem(f))||d}catch(e){return d}};
let cfg={tg:'',chat:'',groq:'',...rd('config.json',{})};
const M={EURUSD:'frxEURUSD',GBPUSD:'frxGBPUSD',USDJPY:'frxUSDJPY',XAUUSD:'frxXAUUSD',XAGUSD:'frxXAGUSD',BTCUSD:'cryBTCUSD',ETHUSD:'cryETHUSD',NASDAQ:'OTC_NDX',US30:'OTC_DJI'};
let S={play:{},prog:{},sigs:[],last:'',learned:0,ki:0,...rd('state.json',{})};
const save=()=>{try{localStorage.setItem('state.json',JSON.stringify(S))}catch(e){}};
const f=n=>+(+n).toPrecision(6);
let ws,rid=0,pend={};
const conn=()=>new Promise(r=>{ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');ws.onerror=()=>{};ws.onopen=()=>r();ws.onclose=()=>{ws=null};ws.onmessage=e=>{const m=JSON.parse(e.data),p=pend[m.req_id];if(p){delete pend[m.req_id];m.error?p[1](m.error.message):p[0](m)}}});
const ask=async q=>{if(!ws||ws.readyState!==1)await conn();return new Promise((a,b)=>{const id=++rid;pend[id]=[a,b];ws.send(JSON.stringify({...q,req_id:id}));setTimeout(()=>{if(pend[id]){delete pend[id];b('timeout')}},20000)})};
const candles=async(s,n)=>(await ask({ticks_history:s,adjust_start_time:1,count:n,end:'latest',granularity:900,style:'candles'})).candles.map(k=>({t:k.epoch,o:+k.open,h:+k.high,l:+k.low,c:+k.close}));
const ema=(a,p)=>{const k=2/(p+1);let e=a[0];return a.map(x=>e=x*k+e*(1-k))};
const prep=c=>{const cl=c.map(x=>x.c),tr=c.map((x,i)=>i?Math.max(x.h-x.l,Math.abs(x.h-c[i-1].c),Math.abs(x.l-c[i-1].c)):x.h-x.l),ag=ema(cl.map((v,i)=>i?Math.max(v-cl[i-1],0):0),27),al=ema(cl.map((v,i)=>i?Math.max(cl[i-1]-v,0):0),27),e2=ema(cl,200),h8=ema(cl,800);
return{c,h8,atr:ema(tr,14),e20:ema(cl,20),e50:ema(cl,50),e200:e2,rsi:ag.map((v,i)=>100-100/(1+v/(al[i]||1e-9))),htf:e2.map((v,i)=>v>h8[i]?1:-1)}};
const hi=(c,i,n)=>Math.max(...c.slice(i-n,i).map(k=>k.h)),lo=(c,i,n)=>Math.min(...c.slice(i-n,i).map(k=>k.l));
const ST={
pullback:(X,i)=>{const{c,e20,e50,e200,atr}=X,k=c[i],a=atr[i];
if(e20[i]>e50[i]&&e50[i]>e200[i]&&k.l<=e20[i]+a*.2&&k.c>e20[i]&&k.c>k.o)return{side:'BUY',sl:Math.min(k.l,e50[i])-a*.2};
if(e20[i]<e50[i]&&e50[i]<e200[i]&&k.h>=e20[i]-a*.2&&k.c<e20[i]&&k.c<k.o)return{side:'SELL',sl:Math.max(k.h,e50[i])+a*.2}},
fvg:(X,i)=>{const{c,atr,htf}=X,k=c[i],a=atr[i];
for(let j=i-2;j>i-30;j--){const A=c[j-1],B=c[j+1],big=Math.abs(c[j].c-c[j].o)>a*.8;
if(big&&htf[i]>0&&A.h<B.l&&B.l-A.h>=a*.3&&k.l<=B.l&&k.c>A.h&&k.c>k.o&&!c.slice(j+2,i).some(x=>x.l<=B.l))return{side:'BUY',sl:A.h-a*.3,zone:[A.h,B.l]};
if(big&&htf[i]<0&&A.l>B.h&&A.l-B.h>=a*.3&&k.h>=B.h&&k.c<A.l&&k.c<k.o&&!c.slice(j+2,i).some(x=>x.h>=B.h))return{side:'SELL',sl:A.l+a*.3,zone:[B.h,A.l]}}},
sweep:(X,i)=>{const{c,atr}=X,k=c[i],a=atr[i],h=hi(c,i,20),l=lo(c,i,20);
if(k.l<l-a*.05&&k.c>l&&k.c>k.o)return{side:'BUY',sl:k.l-a*.2};
if(k.h>h+a*.05&&k.c<h&&k.c<k.o)return{side:'SELL',sl:k.h+a*.2}},
breakout:(X,i)=>{const{c,atr}=X,k=c[i],a=atr[i],h=hi(c,i,20),l=lo(c,i,20);
if(k.c>h&&k.c-k.o>a*.8)return{side:'BUY',sl:k.c-a*1.5};
if(k.c<l&&k.o-k.c>a*.8)return{side:'SELL',sl:k.c+a*1.5}},
obtest:(X,i)=>{const c=X.c.slice(Math.max(0,i-90),i+1),a=X.atr[i],L=c.length-1,k=c[L];
for(const z of zones(c,a).filter(z=>z.kind=='OB'&&z.i<L-4)){const fresh=!c.slice(z.i+4,L).some(x=>z.side=='BUY'?x.l<=z.hi:x.h>=z.lo);
if(z.side=='BUY'&&X.htf[i]>0&&fresh&&k.l<=z.hi&&k.c>z.lo&&k.c>k.o)return{side:'BUY',sl:z.lo-a*.25,zone:[z.lo,z.hi]};
if(z.side=='SELL'&&X.htf[i]<0&&fresh&&k.h>=z.lo&&k.c<z.hi&&k.c<k.o)return{side:'SELL',sl:z.hi+a*.25,zone:[z.lo,z.hi]}}},
meanrev:(X,i)=>{const{c,atr,rsi}=X,k=c[i],a=atr[i];let m=0,s=0;for(let j=i-19;j<=i;j++)m+=c[j].c;m/=20;for(let j=i-19;j<=i;j++)s+=(c[j].c-m)**2;s=Math.sqrt(s/20);
if(rsi[i]<28&&k.c<m-2*s&&k.c>k.o)return{side:'BUY',sl:k.l-a*.5};
if(rsi[i]>72&&k.c>m+2*s&&k.c<k.o)return{side:'SELL',sl:k.h+a*.5}}};
const zones=(c,a)=>{const n=c.length,raw=[];for(let i=Math.max(2,n-80);i<n-1;i++){const k=c[i],mv=c[Math.min(n-1,i+3)].c-k.c,A=c[i-2];
if(k.c<k.o&&mv>=a*1.6)raw.push({side:'BUY',i,lo:k.l,hi:k.h,kind:'OB'});if(k.c>k.o&&-mv>=a*1.6)raw.push({side:'SELL',i,lo:k.l,hi:k.h,kind:'OB'});
if(A.h<k.l&&k.l-A.h>=a*.3)raw.push({side:'BUY',i:i-1,lo:A.h,hi:k.l,kind:'FVG'});if(A.l>k.h&&A.l-k.h>=a*.3)raw.push({side:'SELL',i:i-1,lo:k.h,hi:A.l,kind:'FVG'})}
return raw.filter(z=>{for(let j=z.i+2;j<n;j++){if(z.side=='BUY'&&c[j].c<z.lo)return false;if(z.side=='SELL'&&c[j].c>z.hi)return false}return true}).slice(-6)};
const swings=c=>{const o=[];for(let i=3;i<c.length-3;i++){const w=c.slice(i-3,i+4);if(c[i].h==Math.max(...w.map(k=>k.h)))o.push({i,p:c[i].h,t:'H'});if(c[i].l==Math.min(...w.map(k=>k.l)))o.push({i,p:c[i].l,t:'L'})}
let ph=null,pl=null;return o.map(s=>{if(s.t=='H'){s.lab=ph==null?'H':s.p>ph?'HH':'LH';ph=s.p}else{s.lab=pl==null?'L':s.p>pl?'HL':'LL';pl=s.p}return s})};
const pdl=c=>{const day=k=>new Date(k.t*1000).getUTCDate(),d=day(c[c.length-1]);let pdt=null,h=-1e18,l=1e18;for(let i=c.length-1;i>=0;i--){const dd=day(c[i]);if(dd==d)continue;if(pdt==null)pdt=dd;if(dd!=pdt)break;h=Math.max(h,c[i].h);l=Math.min(l,c[i].l)}return h>-1e18?[f(h),f(l)]:null};
const skip=(st,reg)=>st=='meanrev'?reg:(st!='sweep'&&!reg);
let NEWS=[];const CUR={EURUSD:['EUR','USD'],GBPUSD:['GBP','USD'],USDJPY:['USD','JPY'],XAUUSD:['USD'],XAGUSD:['USD'],BTCUSD:['USD'],ETHUSD:['USD'],NASDAQ:['USD'],US30:['USD']};
const news=async()=>{try{const r=await fetch('https://nfs.faireconomy.media/ff_calendar_thisweek.json');NEWS=(await r.json()).filter(e=>e.impact=='High').map(e=>({c:e.country,t:Date.parse(e.date)}))}catch(e){}};
const blocked=m=>NEWS.some(e=>(CUR[m]||[]).includes(e.c)&&Math.abs(Date.now()-e.t)<18e5);
const CHART=async m=>{const c=await candles(M[m],400),X=prep(c),n=c.length,a=X.atr[n-1],o=n-120,w=c.slice(-60),H=Math.max(...w.map(k=>k.h)),L=Math.min(...w.map(k=>k.l)),px=c[n-1].c,step=px<10?.01:10**(Math.floor(Math.log10(px))-1);
return{m,cs:c.slice(o),ema:[X.e20,X.e50,X.e200].map(v=>v.slice(o).map(f)),zones:zones(c,a).map(z=>({...z,i:Math.max(0,z.i-o)})),sw:swings(c.slice(o)),fib:[.382,.5,.618].map(q=>f(L+(H-L)*q)),rnd:f(Math.round(px/step)*step),pd:pdl(c),sig:S.sigs.find(x=>x.m==m&&x.res==null)||S.sigs.find(x=>x.m==m)}};
const trending=(X,i)=>Math.abs(X.e50[i]-X.e200[i])>X.atr[i];
const sig=(X,i,st)=>{const r=ST[st](X,i);if(!r)return;const k=X.c[i],e=k.c,R=Math.abs(e-r.sl);if(!R||R<X.atr[i]*.3)return;const d=r.side=='BUY'?1:-1;
return{...r,st,e,tp1:e+d*R,tp2:e+2*d*R,i,t:k.t,htf:X.htf[i]*d>0}};
const sess=t=>{const h=new Date(t*1000).getUTCHours();return h<7?'asia':h<13?'london':h<21?'ny':'late'};
const out=(X,s)=>{const d=s.side=='BUY'?1:-1;let h1=false;for(let j=s.i+1;j<Math.min(X.c.length,s.i+49);j++){const k=X.c[j],lim=h1?s.e:s.sl;if(d>0?k.l<=lim:k.h>=lim)return h1?.5:-1;if(d>0?k.h>=s.tp2:k.l<=s.tp2)return 1.5;if(d>0?k.h>=s.tp1:k.l<=s.tp1)h1=true}return h1?.5:null};
const av=a=>a.length?a.reduce((s,x)=>s+x.r,0)/a.length:0,wr=a=>a.length?a.filter(x=>x.r>0).length/a.length:0;
const learn=async m=>{const c=await candles(M[m],5000),X=prep(c),n=c.length,cut=n-1344,rows=[];
for(let i=600;i<n-1;i++){const reg=trending(X,i);if(i%400==0){S.prog[m]=Math.round(i/n*100);await new Promise(r=>setTimeout(r))}
for(const st in ST){if(skip(st,reg))continue;const s=sig(X,i,st);if(!s)continue;const r=out(X,s);if(r==null)continue;rows.push({st,r,se:sess(s.t),tr:i<cut,al:s.htf})}}
const P={};for(const st in ST){const all=rows.filter(x=>x.st==st),A=all.filter(x=>x.tr),B=all.filter(x=>!x.tr);
const ses=['asia','london','ny','late'].filter(q=>{const z=A.filter(x=>x.se==q);return z.length>=4&&av(z)>0});
P[st]={ok:A.length>=8&&av(A)>.1&&(B.length<3||av(B)>=0)&&ses.length>0,ses,n:all.length,wr:Math.round(100*wr(all)),exp:+av(all).toFixed(2),test:+av(B).toFixed(2),tn:B.length,lc:all.filter(x=>x.r<0&&!x.al).length,ln:all.filter(x=>x.r<0).length}}
S.play[m]=P;S.prog[m]=100};
const relearn=async()=>{if(Date.now()-S.learned<6048e5)return;for(const m in M){S.prog[m]=0;try{await learn(m)}catch(e){S.prog[m]='error'}save()}if(Object.keys(S.play).length)S.learned=Date.now();save()};
const review=async list=>{const ks=(cfg.groq||'').split(',').map(x=>x.trim()).filter(Boolean);if(!ks.length||!list.length)return;
try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+ks[S.ki++%ks.length]},body:JSON.stringify({model:'llama-3.3-70b-versatile',temperature:.2,max_tokens:300,messages:[{role:'user',content:'Review these trade setups. Reply ONLY with a JSON array [{"i":0,"keep":true,"note":"max 12 words"}]. Setups: '+JSON.stringify(list.map((s,i)=>({i,market:s.m,side:s.side,strategy:s.st,score:s.score,hitRate:s.wr,alignedWithHigherTrend:s.htf})))}]})});
const a=JSON.parse((await r.json()).choices[0].message.content.match(/\[[\s\S]*\]/)[0]);a.forEach(x=>{const s=list[x.i];if(s){s.note=x.note;s.keep=x.keep!==false}})}catch(e){}};
const notify=async s=>{const t=`${s.m} ${s.side} (${s.st}) score ${s.score}\nEntry ${f(s.e)} SL ${f(s.sl)}\nTP1 ${f(s.tp1)} TP2 ${f(s.tp2)}\nSimilar: ${s.wr}% win over ${s.n} trades${s.note?'\n'+s.note:''}`;
try{const N=Capacitor.Plugins.LocalNotifications;await N.requestPermissions();await N.schedule({notifications:[{id:Date.now()%2147483647,title:s.m+' '+s.side,body:t}]})}catch(e){}
if(cfg.tg&&cfg.chat)fetch(`https://api.telegram.org/bot${cfg.tg}/sendMessage`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({chat_id:cfg.chat,text:t})}).catch(()=>{})};
const scan=async()=>{const nw=[],open=()=>S.sigs.filter(x=>x.res==null).length;
for(const m in M){const P=S.play[m];if(!P)continue;
try{const c=await candles(M[m],1000),X=prep(c),i=c.length-2;
for(const g of S.sigs.filter(x=>x.m==m&&x.res==null)){const j=c.findIndex(k=>k.t==g.t);if(j>0){const r=out(X,{...g,i:j});if(r!=null)g.res=r}if(g.res==null&&Date.now()-g.at>864e5)g.res=0}
const reg=trending(X,i);
for(const st in ST){const p=P[st];if(blocked(m))break;if(!p||!p.ok||skip(st,reg))continue;const s=sig(X,i,st);if(!s||!p.ses.includes(sess(s.t)))continue;
if(S.sigs.some(x=>x.m==m&&Date.now()-x.at<144e5)||nw.some(x=>x.m==m))continue;
const d4=s.side=='BUY'?1:-1,h4=X.h8[i]>X.h8[i-96]?1:-1,score=Math.min(95,Math.round(45+p.wr*.35+p.exp*15+(s.htf?10:0)+(h4*d4>0?5:0)));if(score<65)continue;
const w=c.slice(-60),H=Math.max(...w.map(k=>k.h)),L=Math.min(...w.map(k=>k.l)),step=s.e<10?.01:10**(Math.floor(Math.log10(s.e))-1);
nw.push({...s,m,score,wr:p.wr,n:p.n,at:Date.now(),cs:c.slice(-100),ema:[X.e20,X.e50,X.e200].map(a=>a.slice(-100).map(f)),fib:[.382,.5,.618].map(q=>f(L+(H-L)*q)),rnd:f(Math.round(s.e/step)*step),res:null,h4:h4*d4>0,why:({pullback:'Pullback to the 20 EMA with stacked EMAs',fvg:'First retest of a fair value gap after an impulse',sweep:'Liquidity sweep of a 20-bar high or low, then a close back inside',breakout:'Strong close through the 20-bar range',meanrev:'Oversold or overbought at the Bollinger band',obtest:'First retest of an order block'})[st]+(s.htf?', with the 1H trend':', against the 1H trend')+', '+sess(s.t)+' session'})}
}catch(e){}}
nw.sort((a,b)=>b.score-a.score);const l5=S.sigs.filter(x=>x.res!=null).slice(0,5),pause=l5.length==5&&l5.every(x=>x.res<0)&&Date.now()-l5[0].at<216e5;S.pause=pause;const top=pause?[]:nw.slice(0,Math.max(0,3-open())).slice(0,5);await review(top);
for(const s of top.filter(x=>x.keep!==false)){delete s.i;S.sigs.unshift(s);notify(s)}
S.sigs=S.sigs.slice(0,25);S.last=new Date().toISOString();save()};
window.E={chart:CHART,api:()=>({pause:S.pause,news:NEWS.length,play:S.play,prog:S.prog,sigs:S.sigs,cfg:{tg:!!cfg.tg,chat:!!cfg.chat,groq:!!cfg.groq},last:S.last}),cfg:b=>{cfg={...cfg,...b};localStorage.setItem('config.json',JSON.stringify(cfg))}};
(async()=>{news();setInterval(news,36e5);await relearn();setInterval(()=>relearn().catch(()=>{}),216e5);setInterval(()=>scan().catch(()=>{}),6e4);scan().catch(()=>{})})();
try{Capacitor.Plugins.KeepAlive.start()}catch(e){}
})();</script>
<script>
let D={play:{},prog:{},sigs:[],cfg:{}},tab='sig',sel=0;
const MK={EURUSD:1,GBPUSD:1,USDJPY:1,XAUUSD:1,XAGUSD:1,BTCUSD:1,ETHUSD:1,NASDAQ:1,US30:1};const T={sig:'Signals',an:'Analyze',mk:'Markets',lr:'Learning',st:'Settings'};let cm='EURUSD',ps='all';const PS={all:{n:'All',d:'Every overlay and every strategy.',st:null,ov:'ezsfl'},adam:{n:'Adam Khoo',d:'Impulse pullback: 20, 50 and 200 EMAs stacked, price pulls back to the 20 EMA.',st:['pullback'],ov:'e'},ict:{n:'ICT',d:'Fair value gaps, order blocks, liquidity sweeps and market structure.',st:['fvg','obtest','sweep'],ov:'zsl'},alex:{n:'FXAlexG',d:'Key levels: Fibs, round numbers, previous-day high and low, breakouts.',st:['breakout','sweep'],ov:'fl'},steven:{n:'Steven Hart',d:'Structure and reversals: swing labels, pullbacks and band reversals.',st:['pullback','meanrev'],ov:'es'}},f=n=>+(+n).toPrecision(6),$=i=>document.getElementById(i);
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<60?m+'m ago':Math.round(m/60)+'h ago'};
const card=(s,i)=>{const r=s.res==null?'open':s.res>0?'won +'+s.res+'R':s.res<0?'lost -1R':'flat';
return `<div class=g onclick="cm='${s.m}';tab='an';R()"><b>${s.m}</b> <span class="b ${s.side[0]}">${s.side}</span> <span class="b k">${s.score}</span> <span class=s>${s.st} - ${ago(s.at)} - ${r}</span><div class=s style="margin-top:6px">Entry ${f(s.e)} - SL ${f(s.sl)}<br>TP1 ${f(s.tp1)} - TP2 ${f(s.tp2)}</div><div class=s>${s.why||''}${s.h4?', 4H agrees':''}<br>Similar setups: ${s.wr}% win over ${s.n} trades${s.note?'<br>'+s.note:''}</div></div>`};
const learning=()=>{const v=Object.values(D.prog);return v.length&&v.some(x=>x!=100)?'Still learning the last 2 months ('+v.filter(x=>x==100).length+'/'+v.length+' markets done).':'Scanning every minute. Signals appear only when learned rules agree.'};
const V={
sig:()=>'<h2>Signals</h2>'+(D.pause?'<div class=g>Stand-aside mode: the last 5 signals all lost, so new signals are paused for a few hours.</div>':'')+`<div class=s style="margin:0 2px 8px">News filter: ${D.news?'on ('+D.news+' high-impact events this week)':'off (calendar not reachable)'}</div>`+(D.sigs.length?D.sigs.map(card).join(''):`<div class=g>No signals yet.<div class=s style="margin-top:6px">${learning()}</div></div>`),
an:()=>`<h2>Analyze</h2><div style="overflow-x:auto;white-space:nowrap;margin-bottom:8px">${Object.keys(MK).map(m=>`<span class="b ${m==cm?'B':'k'}" style="margin-right:6px;padding:6px 12px" onclick="cm='${m}';R()">${m}</span>`).join('')}</div><div style="overflow-x:auto;white-space:nowrap;margin-bottom:8px">${Object.keys(PS).map(k=>`<span class="b ${k==ps?'B':'k'}" style="margin-right:6px;padding:6px 12px" onclick="ps='${k}';R()">${PS[k].n}</span>`).join('')}</div><div class=s style="margin-bottom:8px">${PS[ps].d}</div><canvas id=cv></canvas><div id=plan style="margin-top:10px"></div>`,
mk:()=>'<h2>Markets</h2>'+Object.keys(MK).map(m=>{const P=D.play[m],on=P?Object.keys(P).filter(k=>P[k].ok).sort((a,b)=>P[b].exp-P[a].exp):[],b=on[0],o=D.sigs.filter(s=>s.m==m&&s.res==null).length;return `<div class=g onclick="cm='${m}';tab='an';R()"><b>${m}</b> <span class="b ${on.length?'B':'k'}">${P?on.length+'/6 strategies on':D.prog[m]!=null?'learning '+D.prog[m]+'%':'waiting'}</span><div class=s style="margin-top:4px">${b?'Best: '+b+' ('+P[b].wr+'% win, '+P[b].exp+' R avg)':P?'No proven edge right now, so it is skipped.':''}${o?' - '+o+' open signal':''}</div></div>`}).join(''),
lr:()=>'<h2>Learning</h2>'+(Object.keys(D.prog).length?Object.keys(D.prog).map(m=>{const P=D.play[m],L=P?Object.values(P):[];return `<div class=g><b>${m}</b> <span class=s>${P?'learned':'learning '+D.prog[m]+'%'}</span>`+(P?'<table><tr><th>Strategy<th>Win (n)<th>Avg R<th>Test R<th>Use</tr>'+Object.keys(P).map(k=>`<tr><td>${k}<td>${P[k].wr}% (${P[k].n})<td>${P[k].exp}<td>${P[k].test} (${P[k].tn})<td>${P[k].ok?P[k].ses.join(', '):'off'}`).join('')+`</table><div class=s style="margin-top:6px">Losses against the 1H trend: ${L.reduce((a,p)=>a+p.lc,0)} of ${L.reduce((a,p)=>a+p.ln,0)}</div>`:'')+'</div>'}).join(''):`<div class=g>Starting up...</div>`),
st:()=>`<h2>Settings</h2><div class=g><div class=s>Telegram bot token ${D.cfg.tg?'(saved)':''}</div><input id=tg type=password><div class=s>Telegram chat id ${D.cfg.chat?'(saved)':''}</div><input id=chat><div class=s>Groq keys, comma separated ${D.cfg.groq?'(saved)':''}</div><input id=groq type=password><button onclick=sv()>Save</button><button style="margin-top:12px" onclick="try{Capacitor.Plugins.KeepAlive.batteryExemption()}catch(e){}">Allow background running</button><div class=s style="margin-top:10px">Phone alerts are built in. Telegram and AI are optional.</div></div>`};
async function sv(){const b={};for(const k of['tg','chat','groq'])if($(k).value)b[k]=$(k).value;E.cfg(b);await L();alert('Saved')}
function draw(d){const cv=$('cv');if(!cv)return;const W=cv.width=cv.clientWidth*2,H=cv.height=720,x=cv.getContext('2d'),n=d.cs.length,cw=(W-200)/n,o=PS[ps].ov,R0=W-200,sg=d.sig&&(!PS[ps].st||PS[ps].st.includes(d.sig.st))&&d.sig.res==null?d.sig:null;
let hi=Math.max(...d.cs.map(k=>k.h)),lo=Math.min(...d.cs.map(k=>k.l));if(sg)for(const v of[sg.tp2,sg.sl,sg.tp1]){hi=Math.max(hi,v);lo=Math.min(lo,v)}const p=(hi-lo)*.06;hi+=p;lo-=p;const Y=v=>H-(v-lo)/(hi-lo)*H,X=i=>i*cw+cw/2;x.font='20px system-ui';
if(o.includes('z'))d.zones.forEach(z=>{x.fillStyle=z.side=='BUY'?`rgba(47,191,134,${z.kind=='OB'?.2:.32})`:`rgba(208,74,74,${z.kind=='OB'?.2:.32})`;x.fillRect(X(z.i)-cw/2,Y(z.hi),R0-X(z.i)+cw/2,Math.max(3,Y(z.lo)-Y(z.hi)));x.fillStyle='#e6f4ee';x.fillText(z.kind=='OB'?(z.side=='BUY'?'Demand OB':'Supply OB'):'FVG',X(z.i)+4,Y(z.hi)+20)});
d.cs.forEach((k,i)=>{x.strokeStyle=x.fillStyle=k.c>=k.o?'#2fbf86':'#e0594f';x.lineWidth=2;x.beginPath();x.moveTo(X(i),Y(k.h));x.lineTo(X(i),Y(k.l));x.stroke();x.fillRect(X(i)-cw*.3,Math.min(Y(k.o),Y(k.c)),cw*.6,Math.max(2,Math.abs(Y(k.o)-Y(k.c))))});
if(o.includes('e'))d.ema.forEach((a,j)=>{x.strokeStyle=['#ffa733','#4fc3f7','#b388ff'][j];x.lineWidth=2;x.setLineDash([]);x.beginPath();a.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke()});
if(o.includes('s'))d.sw.forEach(w=>{x.fillStyle=w.lab[1]=='H'||w.lab=='H'?'#7ee0b0':'#ff9a90';if(w.lab=='HH'||w.lab=='HL')x.fillStyle='#7ee0b0';if(w.lab=='LH'||w.lab=='LL')x.fillStyle='#ff9a90';x.fillText(w.lab,X(w.i)-12,w.t=='H'?Y(w.p)-8:Y(w.p)+24)});
const line=(v,c,t,dash)=>{if(v==null||v<lo||v>hi)return;x.strokeStyle=c;x.lineWidth=2;x.setLineDash(dash?[10,8]:[]);x.beginPath();x.moveTo(0,Y(v));x.lineTo(R0,Y(v));x.stroke();x.setLineDash([]);x.fillStyle=c;x.fillRect(R0+4,Y(v)-14,192,28);x.fillStyle='#04221a';x.fillText(t+' '+f(v),R0+10,Y(v)+7)};
if(o.includes('f'))[.382,.5,.618].forEach((q,i)=>line(d.fib[i],'#b79cff','Fib '+q,1));
if(o.includes('l')){line(d.rnd,'#d9a0ff','Round',1);if(d.pd){line(d.pd[0],'#ffd27a','PDH',1);line(d.pd[1],'#ffd27a','PDL',1)}}
if(sg){line(sg.sl,'#ff7b72','Stop -1R');line(sg.tp1,'#2fbf86','TP1 +1R');line(sg.tp2,'#2fbf86','TP2 +2R');line(sg.e,'#4fc3f7','Entry');const ix=d.cs.findIndex(k=>k.t==sg.t);if(ix>=0){x.fillStyle=sg.side=='BUY'?'#2fbf86':'#e0594f';x.fillText(sg.side,X(ix)-18,sg.side=='BUY'?Y(d.cs[ix].l)+26:Y(d.cs[ix].h)-10)}}}
async function loadChart(){try{const d=await E.chart(cm);if(tab!='an')return;draw(d);$('plan').innerHTML=d.sig?card(d.sig,0):'<div class=g>No signal on this market yet. The overlays above are live.</div>'}catch(e){if($('plan'))$('plan').innerHTML='<div class=g>Could not load candles. Check your connection.</div>'}}
function R(){$('n').innerHTML=Object.keys(T).map(k=>`<a class="${k==tab?'on':''}" onclick="tab='${k}';R()">${T[k]}</a>`).join('');$('v').innerHTML=V[tab]();if(tab=='an')loadChart()}
async function L(){try{D=E.api()}catch(e){}if(tab!='st'&&tab!='an')R()}
R();L();setInterval(L,5000);setInterval(()=>{if(tab=='an')loadChart()},6e4);
</script>
