<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Kinaawa High School Kawempe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(251,191,36,0.35)" stroke-width="1.5"/>
  <!-- open book -->
  <g transform="translate(100,92)">
    <path d="M-44,-10 C-44,-22 -22,-28 0,-20 C22,-28 44,-22 44,-10 L44,22 C44,10 22,4 0,12 C-22,4 -44,10 -44,22 Z" fill="#fff" opacity="0.95"/>
    <path d="M0,-20 L0,12" stroke="#1e3a8a" stroke-width="2"/>
    <path d="M-38,-6 C-26,-12 -12,-12 0,-6" stroke="#1e3a8a" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M38,-6 C26,-12 12,-12 0,-6" stroke="#1e3a8a" stroke-width="1.2" fill="none" opacity="0.5"/>
  </g>
  <!-- torch flame -->
  <g transform="translate(100,52)">
    <path d="M0,-14 C6,-6 6,0 0,4 C-6,0 -6,-6 0,-14 Z" fill="url(#gold)"/>
    <rect x="-2" y="4" width="4" height="10" fill="#78350f"/>
  </g>
  <!-- top text -->
  <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <text font-family="Georgia,serif" font-size="15" font-weight="700" fill="#fbbf24" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">KINA AWA HIGH SCHOOL</textPath>
  </text>
  <!-- bottom text -->
  <path id="botArc" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  <text font-family="Georgia,serif" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="3">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">KAWEMPE</textPath>
  </text>
</svg>
