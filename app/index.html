<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>ClassPulse — Every lesson, accounted for</title>
  <meta name="description" content="ClassPulse helps a school's Director of Studies see teacher arrival, lesson attendance and time-in/time-out live — with QR scanning, automatic escalation and NCDC lesson planning.">
  <meta name="theme-color" content="#070b18">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ClassPulse">
  <meta name="application-name" content="ClassPulse">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/theme.css?v=1.6.0">
  <link rel="stylesheet" href="css/app.css?v=1.6.0">
  <style>
    /* First-paint splash — replaced as soon as the app boots. */
    #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px;
      text-align: center; background: var(--bg, #070b18); color: var(--text, #e8ecf7); z-index: 500; }
    #boot .mark { width: 78px; height: 78px; margin: 0 auto; }
    #boot h1 { font: 800 30px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.03em; margin: 0; }
    #boot p { margin: 0; opacity: .6; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
    #boot .bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; margin: 6px auto 0; }
    #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #8b7cf0;
      animation: bootslide 1.1s ease-in-out infinite; }
    @keyframes bootslide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    html[data-booted] #boot { display: none; }
  </style>
</head>
<body>
  <div id="app" role="application" aria-label="ClassPulse"></div>

  <div id="boot">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8b7cf0"/><stop offset="1" stop-color="#6c5ce7"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg1)"/>
      <path d="M12 36h9l4-11 6 20 5-14 4 5h12" fill="none" stroke="#fff" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>ClassPulse</h1>
    <p>Every lesson, accounted for</p>
    <div class="bar"><i></i></div>
  </div>

  <noscript>
    <div style="padding:24px;font:15px/1.6 system-ui;color:#e8ecf7">
      ClassPulse needs JavaScript enabled. Please turn it on and reload this page.
    </div>
  </noscript>

  <!-- QR libraries must load before the modules that wrap them. -->
  <script src="vendor/qrcode-generator.js?v=1.6.0"></script>
  <script src="vendor/jsQR.js?v=1.6.0"></script>

  <!-- core -->
  <script src="js/util.js?v=1.6.0"></script>
  <script src="js/charts.js?v=1.6.0"></script>
  <script src="js/ui.js?v=1.6.0"></script>
  <script src="js/store.js?v=1.6.0"></script>
  <script src="js/qr.js?v=1.6.0"></script>
  <script src="js/curriculum.js?v=1.6.0"></script>
  <script src="js/export.js?v=1.6.0"></script>
  <script src="js/academic.js?v=1.6.0"></script>
  <script src="js/sync.js?v=1.6.0"></script>

  <!-- views -->
  <script src="js/views-common.js?v=1.6.0"></script>
  <script src="js/views-setup.js?v=1.6.0"></script>
  <script src="js/views-dos.js?v=1.6.0"></script>
  <script src="js/views-head.js?v=1.6.0"></script>
  <script src="js/views-admin.js?v=1.6.0"></script>
  <script src="js/views-academic.js?v=1.6.0"></script>
  <script src="js/views-assess.js?v=1.6.0"></script>
  <script src="js/views-school.js?v=1.6.0"></script>

  <!-- shell (boots the app) -->
  <script src="js/app.js?v=1.6.0"></script>

  <script>
    // Mark the shell as interactive as soon as the app has painted.
    (function () {
      function done() { document.documentElement.setAttribute("data-booted", "1"); }
      window.addEventListener("load", function () {
        setTimeout(done, 420);           // let the first render settle
        if ("serviceWorker" in navigator && location.protocol !== "file:") {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        }
      });
    })();
  </script>
</body>
</html>
